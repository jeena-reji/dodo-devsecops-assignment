apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-latest
spec:
  validationFailureAction: Enforce
  background: true

  rules:
    - name: require-non-root
      match:
        any:
        - resources:
            kinds:
            - Pod
      validate:
        message: "Containers must not run as root."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true

    - name: disallow-latest-tag
      match:
        any:
        - resources:
            kinds:
            - Pod
      validate:
        message: "Using latest tag is not allowed."
        foreach:
        - list: "request.object.spec.containers"
          deny:
            conditions:
              any:
              - key: "{{ element.image }}"
                operator: EndsWith
                value: ":latest"